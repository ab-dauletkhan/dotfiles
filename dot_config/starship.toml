# Cozy power-user Starship prompt
# Theme: Everforest Dark Hard
# Shell targets: zsh / bash / fish / Nushell + Ghostty + Monaspace Krypton NF

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

# Keep prompt fast.
scan_timeout = 30
command_timeout = 500

# Previous-command telemetry appears only when one of these modules renders.
format = """
($status$cmd_duration$battery$hostname
[────────────────](bright-black)
)$shell$directory$git_branch$git_status$git_state${custom.jj}$mise$rust$zig$golang$python${custom.uv}$pixi$nodejs$bun$deno$lua$swift$kotlin$docker_context$container$jobs
$character"""

# ─────────────────────────────────────────────────────────────
# Previous-command telemetry
# ─────────────────────────────────────────────────────────────

[status]
disabled = false
symbol = "󰅙"
success_symbol = ""
not_executable_symbol = "󰅙"
not_found_symbol = "󰅙"
sigint_symbol = "󰅙"
signal_symbol = "󰅙"
format = "[$symbol exit $status]($style) "
style = "bold red"
map_symbol = true

[cmd_duration]
disabled = false
min_time = 100
show_milliseconds = true
format = "[ $duration]($style) "
style = "bold yellow"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold blue"
trim_at = "."

# ─────────────────────────────────────────────────────────────
# Current workspace line
# ─────────────────────────────────────────────────────────────

[shell]
disabled = false
format = "[$indicator]($style) "
zsh_indicator = "zsh"
bash_indicator = "bash"
fish_indicator = "fish"
nu_indicator = "nu"
unknown_indicator = "sh"
style = "bold cyan"

[directory]
style = "bold blue"
read_only = " "
read_only_style = "bold red"
truncation_length = 5
truncate_to_repo = false
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"

# Detailed but symbols-only.
conflicted = "󰞇$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count⇣$behind_count "
up_to_date = ""
untracked = "◌$count "
stashed = "≡$count "
modified = "●$count "
staged = "✚$count "
renamed = "»$count "
deleted = "✖$count "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# Jujutsu: show JJ icon inside jj repos.
# It stays intentionally lightweight; no expensive log/status command.
[custom.jj]
description = "Jujutsu repository indicator"
symbol = "󱗆 "
command = "printf ''"
when = "jj root --quiet >/dev/null 2>&1"
shell = ["sh", "-c"]
format = "[$symbol]($style)"
style = "bold purple"

# Mise toolchain manager.
# Starship has a built-in mise module in current docs.
[mise]
symbol = " "
format = "[$symbol]($style)"
style = "bold cyan"
disabled = false

# ─────────────────────────────────────────────────────────────
# Language / tool icons
# Pure Nerd Font icons, no emoji symbols.
# ─────────────────────────────────────────────────────────────

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"
version_format = "${major}.${minor}"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"
version_format = "${major}.${minor}"

[custom.uv]
description = "uv Python project indicator"
symbol = "󰚰 "
command = "printf ''"
when = "test -f uv.lock || grep -q '\\[tool\\.uv\\]' pyproject.toml 2>/dev/null"
shell = ["sh", "-c"]
format = "[$symbol]($style)"
style = "bold purple"

[pixi]
symbol = "󰏗 "
format = "[$symbol]($style)"
style = "bold green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"
version_format = "${major}.${minor}"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
version_format = "${major}.${minor}"

[bun]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"
version_format = "${major}.${minor}"

[deno]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
version_format = "${major}.${minor}"

[lua]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"
version_format = "${major}.${minor}"

[swift]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"
version_format = "${major}.${minor}"

[kotlin]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold purple"
version_format = "${major}.${minor}"

[zig]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"
version_format = "${major}.${minor}"

# ─────────────────────────────────────────────────────────────
# Docker / container
# ─────────────────────────────────────────────────────────────

[docker_context]
symbol = "󰡨 "
format = "[$symbol$context]($style) "
style = "bold blue"
only_with_files = true

[container]
symbol = "⬢ "
format = "[$symbol$name]($style) "
style = "bold red"

[jobs]
symbol = " "
format = "[$symbol$number]($style) "
style = "bold cyan"
number_threshold = 1
symbol_threshold = 1

# ─────────────────────────────────────────────────────────────
# Stable current input lane
# Error is reported above; it does not poison the current prompt.
# ─────────────────────────────────────────────────────────────

[character]
success_symbol = "[=>](bold green)"
error_symbol = "[=>](bold green)"
vimcmd_symbol = "[<=](bold yellow)"
vimcmd_replace_one_symbol = "[<=](bold purple)"
vimcmd_replace_symbol = "[<=](bold purple)"
vimcmd_visual_symbol = "[<=](bold cyan)"
format = "$symbol "

# ─────────────────────────────────────────────────────────────
# Explicitly disabled noise / future modules
# ─────────────────────────────────────────────────────────────

[package]
disabled = true

[time]
disabled = true

[username]
disabled = true

[os]
disabled = true

[memory_usage]
disabled = true

[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[openstack]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[pulumi]
disabled = true

[helm]
disabled = true

[nats]
disabled = true
